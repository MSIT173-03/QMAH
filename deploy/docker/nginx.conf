server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    server_tokens off;

    # 用變數寫上游位址並指定 Docker DNS，後端容器重啟換 IP 後不用重啟 gateway。
    resolver 127.0.0.11 valid=5s;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /admin {
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/(api|hubs|media|uploads|openapi|scalar)(/|$) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 共用圖片與字型：先找前端靜態檔，沒有再交給 API
    location ~ ^/(images|fonts)/ {
        try_files $uri @api;
    }
    location @api {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
