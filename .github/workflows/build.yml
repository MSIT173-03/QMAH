name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build QMAH.sln --no-restore --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: QMAH.Client/package-lock.json

      - name: Restore frontend dependencies
        run: npm ci
        working-directory: QMAH.Client

      - name: Build frontend
        run: npm run build
        working-directory: QMAH.Client

      - name: Check automatic frontend dependency installation
        run: npm run test:setup
        working-directory: QMAH.Client

      - name: Run existing frontend unit checks
        run: npm test -- --watch=false
        working-directory: QMAH.Client

      - name: Restore data tools
        shell: pwsh
        run: |
          $toolProjects = Get-ChildItem tools -Filter *.csproj -Recurse
          foreach ($project in $toolProjects) {
            dotnet restore $project.FullName --locked-mode
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Build data tools
        shell: pwsh
        run: |
          $toolProjects = Get-ChildItem tools -Filter *.csproj -Recurse
          foreach ($project in $toolProjects) {
            dotnet build $project.FullName --no-restore --configuration Release
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
