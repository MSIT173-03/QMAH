<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>清明鑑定屋｜文物鑑定遊戲</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/images/brand/qmah-favicon.svg">
  <!--
    開機畫面：放在所有外部 CSS 之前，Angular 與頁面程式載入前就先執行。
    1. 立即套用使用者記住的主題，與 ThemeService 讀同一個 localStorage key，避免深色使用者先看到淺色。
    2. 直接開啟登入頁時，以畫卷區底色取代瀏覽器預設的白色，並提早下載第一段畫卷。
  -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('qmah-theme');
        if (theme === 'qmah' || theme === 'qmahdark') root.setAttribute('data-theme', theme);
      } catch (e) { /* 無法讀取時維持預設。 */ }

      if (!/^\/login\/?$/.test(location.pathname)) return;
      root.classList.add('qmah-boot-login');

      // 需與 login.ts 的 qingmingSegments[0].image 一致，畫面上的 <img> 才會直接使用這份下載。
      var preload = document.createElement('link');
      preload.rel = 'preload';
      preload.as = 'image';
      preload.href = '/images/login/museum/qingming-court/segment-01.webp';
      preload.setAttribute('fetchpriority', 'high');
      document.head.appendChild(preload);
    })();
  </script>
  <style>
    /*
     * 顏色對應 styles.scss 的 --qmah-jade-deep（登入頁 .museum-media 的底色），此時全站 CSS 尚未載入，只能寫定值。
     * 只在還沒有任何路由頁面時生效：<app-root> 只有 <router-outlet>，頁面畫出後會成為它的下一個兄弟元素，
     * 規則隨即失效，即使登入頁被導向其他頁面也不會殘留底色。不支援 :has() 的瀏覽器維持原本的白色。
     */
    html.qmah-boot-login:not(:has(app-root > router-outlet + *)) {
      background: #145a53;
    }

    html.qmah-boot-login[data-theme='qmahdark']:not(:has(app-root > router-outlet + *)) {
      background: #8fd4c4;
    }
  </style>
  <!-- ui-integration: 使用可部署的 Google CJK 字體改善繁體中文在手機上的筆畫清晰度，保留系統 fallback 避免字體服務失效時無法閱讀。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Color+Emoji&display=swap">
</head>
<body>
  <!-- MIT-licensed SpinKit Circle Fade; the gate stays until initial navigation is ready. -->
  <div id="qmah-boot-loader" role="status" aria-live="polite">
    <div class="qmah-boot-inner"><div class="qmah-boot-ring" aria-hidden="true">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><b>鑑</b>
    </div><p>正在準備這一頁</p><span>精彩內容，馬上呈現</span></div>
  </div>
  <style>
    #qmah-boot-loader{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:#fbfaf7;color:#263239}
    [data-theme="qmahdark"] #qmah-boot-loader{background:#17181a;color:#f2ede3}
    .qmah-boot-inner{text-align:center;padding:32px}.qmah-boot-ring{position:relative;width:104px;height:104px;margin:0 auto 28px;color:#af823a}
    .qmah-boot-ring i{position:absolute;inset:0;transform:rotate(calc(var(--i)*30deg))}.qmah-boot-ring i:before{content:"";display:block;width:9px;height:9px;margin:0 auto;border-radius:50%;background:currentColor;animation:qmah-boot-fade 1.2s infinite ease-in-out both;animation-delay:calc(var(--i)*.1s - 1.2s)}
    .qmah-boot-ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 34px 'Noto Serif TC',serif}.qmah-boot-inner p{margin:0 0 10px;font:600 20px 'Noto Sans TC',sans-serif}.qmah-boot-inner>span{font-size:14px;color:#716a60}
    @keyframes qmah-boot-fade{0%,39%,100%{opacity:.15}40%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.qmah-boot-ring i:before{animation:none;opacity:.6}}
  </style>
  <noscript><style>#qmah-boot-loader{display:none}</style><p>請啟用 JavaScript，才能使用清明鑑定屋。</p></noscript>
  <app-root></app-root>
  <!-- Cloudflare Turnstile -->
<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
  async
  defer>
</script>
</body>
</html>
