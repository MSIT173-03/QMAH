<main class="account-page">
  <header class="account-masthead">
    <a class="brand" routerLink="/game" aria-label="返回多人房間大廳">
      <img src="/assets/brand/qmah-logo.svg" alt="清明鑑定屋" />
    </a>
    <a class="back-link" routerLink="/game">返回多人房間大廳</a>
  </header>

  <section class="account-panel" aria-labelledby="account-title" [attr.aria-busy]="loading || busy">
    @if (accountService.account(); as account) {
      <h1 id="account-title">目前登入：{{ account.email }}</h1>
      <p>{{ account.nickname || account.email }}</p>
      <button type="button" (click)="logout()" [disabled]="loading || busy">{{ busy ? '送出中…' : '登出並切換帳號' }}</button>
    } @else {
      <h1 id="account-title">登入遊戲帳號</h1>
      <form (ngSubmit)="login()">
        <label for="account-email">電子郵件</label>
        <input
          id="account-email"
          name="email"
          type="email"
          autocomplete="username"
          [(ngModel)]="email"
          required
          [disabled]="loading || busy"
        />
        <label for="account-password">密碼</label>
        <input
          id="account-password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
          [disabled]="loading || busy"
        />
        <button type="submit" [disabled]="loading || busy || !email.trim() || !password">{{ busy ? '送出中…' : '登入' }}</button>
      </form>
    }

    @if (error) {
      <p class="account-error" role="alert">{{ error }}</p>
    }
  </section>
</main>
