<div class="qr-backdrop" (click)="close.emit()"></div>
<section #dialog class="qr-sheet" role="dialog" aria-modal="true" aria-labelledby="qr-title" tabindex="-1">
  <header>
    <div><p>分享房間</p><h2 id="qr-title">掃描 QR 碼讀取房間代碼</h2></div>
    <button type="button" (click)="close.emit()" aria-label="關閉 QR 碼">×</button>
  </header>
  <div class="qr-frame">
    <qrcode [qrdata]="room().roomCode" [width]="220" [elementType]="'svg'" [errorCorrectionLevel]="'M'" [alt]="'房間代碼 ' + room().roomCode" [ariaLabel]="'房間代碼 ' + room().roomCode"></qrcode>
  </div>
  <code>{{ room().roomCode }}</code>
  <p>把 QR 碼傳給朋友，他們掃描後就能取得房間代碼。</p>
  <button type="button" class="qr-copy" (click)="copyRoomCode()">複製房間代碼</button>
</section>
