@if (attempt; as current) {
  <div class="demo-table">
          <app-game-training-play-sheet
            class="is-playing is-focus-mode"

            [attempt]="current"
            [isComplete]="false" [demonstration]="true"
            [paused]="paused"
            [completing]="completing"
            [resultFrozen]="phase === 'complete'"
            [imageUnavailable]="imageUnavailable"
            [failedImageKeys]="failedImageKeys"
            [locatorOptions]="locatorOptions"
            [locatorCropX]="locatorCropX"
            [locatorCropY]="locatorCropY"
            [locatorAnswers]="locatorAnswers" [locatorHintArtifactId]="locatorHintArtifactId"
            [locatorExcludedIds]="locatorExcludedIds"
            [memoryCards]="memoryCards"
            [memoryBusy]="memoryBusy"
            [memoryMatched]="memoryMatched"
            [memoryPairCount]="memoryPairCount"
            [memoryFeedback]="memoryFeedback"
            [moves]="moves"
            [puzzleOrder]="puzzleOrder"
            [puzzleSelection]="puzzleSelection"
            [puzzleHintRegion]="puzzleHintRegion"
            [restoreOrder]="restoreOrder"
            [restoreSelection]="restoreSelection"
            [restoreHintRegion]="restoreHintRegion"
            [autoPlaced]="autoPlaced"
            [isRestoreSolved]="isRestoreSolved"
            [memoryHints]="memoryHints"
            [currentArtifactHint]="currentArtifactHint"
            [progressPercent]="progressPercent"
            [elapsedLabel]="elapsedLabel"
            [progressText]="progressText"
            [canAskForHelp]="false"
            [canComplete]="canComplete"
            (pauseRequested)="openPause()"
            (helpRequested)="openPause(); helpRequested = true"
            (completeRequested)="completeAttempt()"
            (detailLocated)="locateDetail($event)"
            (boardFocusMove)="moveBoardFocus($event.event, $event.slot, $event.columns)"
            (imageError)="markImageFailed($event)"
            (memoryFlipped)="flipMemory($event)"
            (puzzleOrderChange)="updatePlacement('puzzle', $event)"
            (restoreOrderChange)="updatePlacement('restore', $event)"
            (moveMade)="recordPlacement()"
            (hintUsed)="recordHint()"
            (autoCompleted)="recordAuto($event)"
            (settlementRequested)="completeAttempt()"
            (locatorAvailability)="imageUnavailable = !$event"
            (puzzleAvailability)="setPuzzleAvailability($event)"
            (scrollAvailability)="setScrollAvailability($event)">
            <span play-status class="demo-status" role="status">{{ phase === 'complete' ? '試玩完成' : autoPlaying ? '自動示範中' : '自行操作' }} · 不計成績與獎勵</span>
            <div play-controls class="demo-controls">
              @if (phase === 'playing') { <button type="button" [attr.aria-pressed]="autoPlaying" (click)="toggleAutoPlay()">{{ autoPlaying ? '自己操作' : '自動示範' }}</button> }
              <button type="button" (click)="restartDemo()">重新試玩</button>
              @if (phase === 'complete') { <a class="demo-start" routerLink="/game/training" [queryParams]="{ game: modeCode() }">正式挑戰</a> }
            </div>
          </app-game-training-play-sheet>
  </div>
}
<dialog #pauseDialog class="demo-pause" aria-labelledby="demo-pause-title" (close)="resumeFromPause()">
  <h2 id="demo-pause-title">試玩已暫停</h2><p>目前進度已保留，繼續後可接著{{ autoPlaying ? '觀看示範' : '操作盤面' }}。</p><button type="button" autofocus (click)="closePause()">繼續試玩</button>
</dialog>
