<!-- ui-integration: 專用玩法說明頁直接呈現完整流程，不再額外要求玩家展開一次。 -->
<section class="game-how-to" [attr.data-variant]="variant()" aria-label="玩法說明">
  <header class="game-how-to__heading">
    <span class="game-how-to__eyebrow">{{ content().eyebrow }} · 玩法說明</span>
    <strong>{{ content().title }}</strong>
  </header>
  <div class="game-how-to__body">
    <p>{{ content().description }}</p>
    <ol aria-label="玩法流程">
      @for (step of content().steps; track step.label) {
        <li>
          <span class="game-how-to__step-marker">{{ step.label }}</span>
          <div><strong>{{ step.title }}</strong><p>{{ step.description }}</p></div>
        </li>
      }
    </ol>
  </div>
</section>
