<div class="qmah-social-page">
<app-social-spotlight />

<header class="social-page-head">
  <h1 class="social-page-title">歷史公告</h1>
</header>

<app-social-shell [activeBoard]="null">
@if (loadError) {
  <div class="alert alert-error mb-4" role="alert">{{ loadError }}</div>
}

<!-- 公佈欄：最新一則是大卡片（可展開全文），其餘收成一列一則的清單，點一下在原地展開，不必捲很長。 -->
@if (announcements.length === 0 && !loadError) {
  <div class="social-state">目前還沒有公告</div>
}
@if (announcements.length > 0) {
  <section class="notice-archive" aria-labelledby="notice-archive-title">
    <h2 id="notice-archive-title" class="notice-archive__title">全部公告</h2>
    <ul class="notice-list">
      @for (item of announcements; track item.id) {
        <li class="notice-item" [class.is-open]="expanded.has(item.id)">
          <button type="button" class="notice-row" (click)="toggle(item.id)" [attr.aria-expanded]="expanded.has(item.id)">
            <span class="notice-row__date" aria-hidden="true"><small>{{ item.createdAt | date: 'yyyy' }}</small><strong>{{ item.createdAt | date: 'MM/dd' }}</strong></span>
            <span class="notice-row__main">
              <span class="notice-row__title">{{ item.title }}</span>
              <span class="notice-row__tag">{{ label(item.category) }}</span>
            </span>
            <svg class="notice-row__chev" lucideChevronDown aria-hidden="true" focusable="false"></svg>
          </button>
          @if (expanded.has(item.id)) {
            <div class="notice-item__body"><app-social-post-content [content]="item.content || item.summary || ''" /></div>
          }
        </li>
      }
    </ul>
  </section>
}
</app-social-shell>
</div>
