<div class="min-h-screen bg-base-200">

  <div class="navbar bg-base-100 shadow-sm px-6">
    <div class="flex-1">
      <span class="text-xl font-bold">
        會員中心
      </span>
    </div>

    <div class="flex-none">
      <button
        class="btn btn-error btn-outline"
        (click)="logout()"
        [disabled]="loggingOut"
      >
        @if (loggingOut) {
          <span class="loading loading-spinner loading-sm"></span>
          登出中
        } @else {
          登出
        }
      </button>
    </div>
  </div>

  <main class="max-w-6xl mx-auto p-6">

    <div class="mb-6">
      <h1 class="text-3xl font-bold">
        會員中心
      </h1>

      <p class="text-base-content/60 mt-2">
        歡迎登入 QMAH！
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- 個人資料 -->
      <a
        routerLink="/member/profile"
        class="card bg-base-100 shadow hover:shadow-lg transition cursor-pointer"
      >
        <div class="card-body">

          <h2 class="card-title">
            個人資料
          </h2>

          <p class="text-base-content/60">
            查看暱稱、Email、自我介紹與公開設定。
          </p>

          <div class="card-actions justify-end mt-4">
            <span class="btn btn-primary btn-sm">
              查看資料
            </span>
          </div>

        </div>
      </a>

      <!-- 點數與鑰匙 -->
      <a
        routerLink="/member/economy"
        class="card bg-base-100 shadow hover:shadow-lg transition cursor-pointer"
      >
        <div class="card-body">

          <h2 class="card-title">
            點數與鑰匙
          </h2>

          <p class="text-base-content/60">
            查看鑑定點數、鑰匙進度與持有鑰匙。
          </p>

          <div class="card-actions justify-end mt-4">
            <span class="btn btn-primary btn-sm">
              查看資產
            </span>
          </div>

        </div>
      </a>

      <!-- 成就與稱號 -->
      <a
        routerLink="/member/achievements"
        class="card bg-base-100 shadow hover:shadow-lg transition cursor-pointer"
      >
        <div class="card-body">

          <h2 class="card-title">
            成就與稱號
          </h2>

          <p class="text-base-content/60">
            查看已取得的成就與目前展示中的稱號。
          </p>

          <div class="card-actions justify-end mt-4">
            <span class="btn btn-primary btn-sm">
              查看成就
            </span>
          </div>

        </div>
      </a>

      <!-- 每日登入 -->
      <a
        routerLink="/member/daily-activity"
        class="card bg-base-100 shadow hover:shadow-lg transition cursor-pointer"
      >
        <div class="card-body">

          <h2 class="card-title">
            每日登入
          </h2>

          <p class="text-base-content/60">
            每日簽到並查看累積登入與連續登入紀錄。
          </p>

          <div class="card-actions justify-end mt-4">
            <span class="btn btn-primary btn-sm">
              查看進度
            </span>
          </div>

        </div>
      </a>

      <!-- 我的地址 -->
      <a
        routerLink="/member/addresses"
        class="card bg-base-100 shadow hover:shadow-lg transition cursor-pointer"
      >
        <div class="card-body">

          <h2 class="card-title">
            我的地址
          </h2>

          <p class="text-base-content/60">
            管理收件地址、新增或修改地址，並設定預設地址。
          </p>

          <div class="card-actions justify-end mt-4">
            <span class="btn btn-primary btn-sm">
              管理地址
            </span>
          </div>

        </div>
      </a>

    </div>

  </main>

</div>
