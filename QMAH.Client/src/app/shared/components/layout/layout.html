<div class="app-shell" [attr.data-area]="activeArea()" [class.game-focus-mode]="activeArea() === 'game' && gameFocus.active()">
  <a class="app-skip-link" href="#main-content">跳至主要內容</a>

  <header class="app-header">
    <div class="app-header__inner">
      <button
        type="button"
        #menuTrigger
        class="app-menu-toggle"
        aria-label="開啟主要導覽"
        aria-controls="mobile-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <app-qmah-icon name="menu" size="22" aria-hidden="true" />
      </button>

      <a class="app-brand" routerLink="/home" aria-label="回到清明鑑定屋首頁" (click)="closeMenu()">
        <img [src]="logoSrc()" alt="清明鑑定屋" />
      </a>

      <div class="app-header__navigation">
        <app-area-navigation variant="desktop" />

        @if (isSocialArea()) {
          <!-- ui-integration: 社群的貼文、活動與公告是同一 Area 的既有頁面；補上桌面次導覽，避免入口只藏在 Mobile drawer。 -->
          <nav class="app-context-navigation" aria-label="社群功能">
            <a routerLink="/social/posts" [class.is-active]="currentUrl().startsWith('/social/posts')">貼文</a>
            <a routerLink="/social/events" [class.is-active]="currentUrl().startsWith('/social/events')">活動</a>
            <a routerLink="/social/announcements" [class.is-active]="currentUrl().startsWith('/social/announcements')">公告</a>
          </nav>
        }
      </div>

      <div class="app-header__actions">
        @if (meApi.me(); as me) {
          <!-- 帳號小選單：會員中心、（管理員）管理後台、登出都收在這裡 -->
          <div class="app-account-wrap">
            <button type="button" class="app-account" aria-haspopup="true" aria-controls="account-panel" [attr.aria-expanded]="accountOpen()" aria-label="帳號選單" (click)="toggleAccount()">
              @if (me.avatarPath && me.avatarPath !== failedAvatarPath()) {
                <img
                  class="app-account__avatar app-account__avatar--image"
                  [src]="me.avatarPath"
                  [alt]="(me.displayName || me.email) + ' 的頭貼'"
                  loading="lazy"
                  (error)="onAvatarError(me.avatarPath)"
                />
              } @else {
                <span class="app-account__avatar" aria-hidden="true">{{ (me.displayName || me.email).charAt(0).toUpperCase() }}</span>
              }
              <span class="app-account__copy">
                <strong>{{ me.displayName || me.email }}</strong>
              </span>
              <span class="app-account__chevron" aria-hidden="true"></span>
            </button>
            <nav id="account-panel" class="app-account-panel" [hidden]="!accountOpen()" aria-label="帳號">
              <div class="app-account-panel__who"><strong>{{ me.displayName || me.email }}</strong>@if (me.displayName) { <small>{{ me.email }}</small> }</div>
              <a routerLink="/member" (click)="closeMenu()">會員中心</a>
              @if (isAdmin()) {
                <a class="app-admin-entry app-mobile-admin-entry" [href]="adminEntryUrl" (click)="confirmAdminNavigation($event)">管理後台</a>
              }
              <button type="button" class="app-logout" [disabled]="loggingOut()" (click)="logout()">{{ loggingOut() ? '登出中…' : '登出' }}</button>
            </nav>
          </div>
        } @else {
          <a class="app-login" routerLink="/login" (click)="closeMenu()">登入</a>
        }

        <app-notifications-bell />

        <label class="app-theme-toggle" aria-label="切換深色模式">
          <input
            type="checkbox"
            value="qmahdark"
            class="theme-controller"
            [checked]="themeService.theme() === 'qmahdark'"
            (change)="themeService.toggleTheme()"
          />
          <app-qmah-icon class="theme-icon theme-icon--light" name="sun" size="22" aria-hidden="true" />
          <app-qmah-icon class="theme-icon theme-icon--dark" name="moon" size="22" aria-hidden="true" />
        </label>

      </div>
    </div>
  </header>

  <!-- ui-integration: Mobile 只保留一個可見 drawer，Route 改變後由 LayoutComponent 自動關閉。 -->
  <button
    type="button"
    class="app-mobile-backdrop"
    [class.is-open]="menuOpen()"
    aria-label="關閉主要導覽"
    (click)="closeMenu()"
  ></button>

  <aside
    #mobileNavigation
    id="mobile-navigation"
    class="app-mobile-drawer"
    [class.is-open]="menuOpen()"
    [attr.aria-hidden]="!menuOpen()"
    [attr.inert]="menuOpen() ? null : ''"
  >
    <div class="app-mobile-drawer__header">
      <div>
        <strong>清明鑑定屋導覽</strong>
        <span>探索、遊玩與交流</span>
      </div>
      <button type="button" class="app-icon-button" aria-label="關閉主要導覽" (click)="closeMenu()">
        <app-qmah-icon name="x" size="22" aria-hidden="true" />
      </button>
    </div>

    <div class="app-mobile-drawer__body">
      <p class="app-mobile-drawer__label">主要功能</p>
      <!-- ui-integration: Mobile 主要與次級入口共用同一個泛用 renderer；不在 Shell 內硬編 Area 專屬 markup。 -->
      <app-area-navigation variant="mobile" [groups]="mobileNavigationGroups()" (itemSelected)="closeMenu()" />
    </div>

    @if (!meApi.me()) {
      <div class="app-mobile-drawer__footer"><a routerLink="/login" (click)="closeMenu()">登入會員</a></div>
    }
  </aside>

  <!-- ui-integration: App Shell 擁有唯一主要內容 landmark；子 Area 的 wrapper 僅保留原本 class 與版面，不再巢狀使用 main。 -->
  <main id="main-content" class="app-main">
    <router-outlet></router-outlet>
  </main>

  <!-- ui-integration: 所有 App Shell route 共用同一個 footer，首頁與深層頁都保留合理的回站入口。 -->
  <app-site-footer />
</div>

<dialog #siteSwitchDialog class="app-site-switch-dialog" aria-labelledby="site-switch-title"
        (click)="onSiteSwitchBackdropClick($event)">
  <div class="app-site-switch-dialog__heading">
    <span class="app-site-switch-dialog__mark"><app-qmah-icon name="shield-check" [size]="22" aria-hidden="true" /></span>
    <div>
      <span class="app-site-switch-dialog__eyebrow">切換工作區</span>
      <h2 id="site-switch-title">前往管理後台？</h2>
    </div>
  </div>
  <div class="app-site-switch-dialog__copy">
    <p>即將離開前台，開啟管理工具。</p>
    <p>請先確認目前的操作已完成。</p>
  </div>
  <div class="app-site-switch-dialog__actions">
    <button type="button" autofocus (click)="closeSiteSwitch()">留在前台</button>
    <a [href]="adminEntryUrl">確認前往</a>
  </div>
</dialog>

<app-toast-container />
