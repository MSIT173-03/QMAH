<div class="app-shell">
  <a class="app-skip-link" href="#main-content">跳至主要內容</a>

  <header class="app-header">
    <div class="app-header__inner">
      <button
        type="button"
        class="app-menu-toggle"
        aria-label="開啟主要導覽"
        aria-controls="mobile-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <a class="app-brand" routerLink="/social/posts" aria-label="回到清明鑑定屋首頁" (click)="closeMenu()">
        <img src="/assets/brand/qmah-logo.svg" alt="清明鑑定屋 QMAH" />
        <span class="app-brand__copy">
          <strong>清明鑑定屋</strong>
          <small>文物探索與互動學習</small>
        </span>
      </a>

      <div class="app-header__navigation">
        <app-area-navigation variant="desktop" />
      </div>

      <div class="app-header__actions">
        @if (meApi.me(); as me) {
          <a class="app-account" routerLink="/member" aria-label="前往會員中心" (click)="closeMenu()">
            <span class="app-account__avatar" aria-hidden="true">{{ (me.displayName || me.email).charAt(0).toUpperCase() }}</span>
            <span class="app-account__copy">
              <strong>{{ me.displayName || me.email }}</strong>
              <small>會員中心</small>
            </span>
          </a>
        } @else {
          <a class="app-login" routerLink="/login" (click)="closeMenu()">登入</a>
        }

        <app-notifications-bell />
        <app-dev-login />

        <label class="app-theme-toggle" aria-label="切換深色模式">
          <input type="checkbox" value="qmahdark" class="theme-controller" />
          <svg class="theme-icon theme-icon--light" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M12 3v2m0 14v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M3 12h2m14 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z" />
          </svg>
          <svg class="theme-icon theme-icon--dark" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" />
          </svg>
        </label>

        @if (meApi.me()) {
          <button
            type="button"
            class="app-logout"
            [disabled]="loggingOut()"
            (click)="logout()"
          >
            {{ loggingOut() ? '登出中…' : '登出' }}
          </button>
        }
      </div>
    </div>
  </header>

  <!-- ui-integration: Mobile 只保留一個可見 drawer，Route 改變後由 LayoutComponent 自動關閉。 -->
  <button
    type="button"
    class="app-mobile-backdrop"
    [class.is-open]="menuOpen()"
    aria-label="關閉主要導覽"
    (click)="closeMenu()"
  ></button>

  <aside
    id="mobile-navigation"
    class="app-mobile-drawer"
    [class.is-open]="menuOpen()"
    [attr.aria-hidden]="!menuOpen()"
  >
    <div class="app-mobile-drawer__header">
      <div>
        <strong>QMAH 導覽</strong>
        <span>探索、遊玩與交流</span>
      </div>
      <button type="button" class="app-icon-button" aria-label="關閉主要導覽" (click)="closeMenu()">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </div>

    <div class="app-mobile-drawer__body">
      <p class="app-mobile-drawer__label">主要功能</p>
      <!-- ui-integration: Mobile 主要與次級入口共用同一個泛用 renderer；不在 Shell 內硬編 Area 專屬 markup。 -->
      <app-area-navigation variant="mobile" [groups]="mobileNavigationGroups()" (itemSelected)="closeMenu()" />
    </div>

    <div class="app-mobile-drawer__footer">
      @if (meApi.me()) {
        <button type="button" class="app-mobile-logout" [disabled]="loggingOut()" (click)="logout()">
          {{ loggingOut() ? '登出中…' : '登出目前帳號' }}
        </button>
      } @else {
        <a routerLink="/login" (click)="closeMenu()">登入會員</a>
      }
    </div>
  </aside>

  <!-- ui-integration: App Shell 擁有唯一主要內容 landmark；子 Area 的 wrapper 僅保留原本 class 與版面，不再巢狀使用 main。 -->
  <main id="main-content" class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>

<app-toast-container />
