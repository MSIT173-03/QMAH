@if (useful() && scrolled() && !gameFocus.active() && !readiness.loading()) {
  <div class="page-tools" [style.--page-tools-accent]="topColors().background">
    @if (open()) {
      <div id="mobile-page-tools-panel" class="page-tools__panel" role="group" aria-label="手機導覽">
        <strong>手機導覽</strong>
        <button type="button" class="page-tools__top" (click)="top()"><svg lucideArrowUp aria-hidden="true"></svg><span>回到頂部</span></button>
        @for (item of sections(); track item.selector) {
          <button type="button" (click)="jump(item)"><span>{{ item.label }}</span><svg lucideChevronRight aria-hidden="true"></svg></button>
        }
        @if (hasNavigation()) {
          <button type="button" (click)="navigate()"><span>主要導覽</span><svg lucideChevronRight aria-hidden="true"></svg></button>
        }
      </div>
    }
    <button #trigger type="button" class="page-tools__trigger" aria-label="手機導覽"
      [attr.aria-expanded]="open()" [attr.aria-controls]="open() ? 'mobile-page-tools-panel' : null" (click)="toggle()">
      @if (open()) { <svg lucideX aria-hidden="true" focusable="false"></svg> }
      @else { <svg lucideList aria-hidden="true" focusable="false"></svg> }
    </button>
  </div>
}
