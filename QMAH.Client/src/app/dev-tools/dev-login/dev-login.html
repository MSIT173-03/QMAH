@if (!isProduction) {
  <div class="fixed bottom-4 left-4 z-50 card bg-neutral text-neutral-content shadow-2xl p-4 border border-warning w-72">
    <h3 class="font-bold text-sm mb-2 text-warning">🔧 開發測試登入（正式環境不會顯示）</h3>

    @if (message) {
      <div class="text-xs mb-2 opacity-90">{{ message }}</div>
    }

    <div class="flex flex-col gap-2">
      <input type="email" placeholder="Email" class="input input-xs input-bordered text-black" [(ngModel)]="email" />
      <input type="password" placeholder="密碼" class="input input-xs input-bordered text-black" [(ngModel)]="password" />
      <div class="flex gap-2">
        <button class="btn btn-xs btn-warning flex-1" [disabled]="pending" (click)="login()">登入</button>
        <button class="btn btn-xs btn-ghost flex-1" [disabled]="pending" (click)="logout()">登出</button>
      </div>
    </div>
  </div>
}
