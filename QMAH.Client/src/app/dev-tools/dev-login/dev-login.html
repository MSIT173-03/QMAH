@if (!isProduction) {
  <div class="dropdown dropdown-end">
    <div tabindex="0" role="button" class="btn btn-ghost btn-circle" aria-label="開發測試登入">
      <span class="text-lg">🔧</span>
    </div>
    <div
      tabindex="0"
      class="dropdown-content bg-neutral text-neutral-content rounded-box z-10 mt-3 w-72 p-4 shadow-lg border border-warning"
    >
      <h3 class="font-bold text-sm mb-2 text-warning">🔧 開發測試登入（正式環境不會顯示）</h3>

      @if (message) {
        <div
          class="text-xs mb-2 px-2 py-1 rounded font-semibold"
          [class.bg-success]="messageType === 'success'"
          [class.text-success-content]="messageType === 'success'"
          [class.bg-error]="messageType === 'error'"
          [class.text-error-content]="messageType === 'error'"
          [class.opacity-90]="messageType === 'info'"
        >
          {{ message }}
        </div>
      }

      <div class="flex flex-col gap-2">
        <input type="email" placeholder="Email" class="input input-xs input-bordered text-black" [(ngModel)]="email" />
        <input type="password" placeholder="密碼" class="input input-xs input-bordered text-black" [(ngModel)]="password" />
        <div class="flex gap-2">
          <button class="btn btn-xs btn-warning flex-1" [disabled]="pending" (click)="login()">登入</button>
          <button class="btn btn-xs btn-ghost flex-1" [disabled]="pending" (click)="logout()">登出</button>
        </div>
      </div>
    </div>
  </div>
}
