<!-- 放大檢視覆蓋層：點擊任意處關閉 -->
@if (open()) {
  <div class="zoom-modal" [class.zoom-modal--closing]="closing()" (click)="onDismiss()">
    <!-- 放大後的商品圖片 -->
    <div class="zoom-image">{{ label() }}</div>

    <!-- 縮圖切換列，點擊只切換圖片而不關閉覆蓋層 -->
    <div class="zoom-thumbs">
      @for (thumb of thumbs(); track $index; let i = $index) {
        <button
          type="button"
          class="zoom-thumb-btn"
          [class.zoom-thumb-btn--active]="i === activeIndex()"
          (click)="onPick(i, $event)"
        >{{ thumb }}</button>
      }
    </div>

    <span class="zoom-hint">{{ hint }}</span>
  </div>
}
