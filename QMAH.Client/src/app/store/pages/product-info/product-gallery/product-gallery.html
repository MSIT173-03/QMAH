<div class="gallery">
  <!-- 外框固定為商品主視覺展示間；內層內容只按原比例等比放大，不再反過來撐開頁面。 -->
  <div class="gallery-stage">
    @if (selectedMode() === 'dynamic') {
      <div class="postcard-viewport" [class.postcard-viewport--portrait]="orientation() === 'portrait'"
        [class.postcard-viewport--rotated]="rotated()">
        <div class="dynamic-card-frame">
          <app-collectible-card [name]="name()" [type]="type()" [image]="image()"
            [dimensions]="dimensions()" [description]="description()" />
          @if (image(); as imageUrl) {
            <img class="orientation-probe" src="{{ imageUrl }}" (load)="onNativeImageLoad($event)" alt="" aria-hidden="true" />
          }
        </div>
      </div>
    } @else if (selectedView() === 'postcard') {
      <div class="postcard-viewport" [class.postcard-viewport--portrait]="orientation() === 'portrait'"
        [class.postcard-viewport--rotated]="rotated()">
        <article class="postcard-static" [class.postcard-static--portrait]="orientation() === 'portrait'">
          <div class="postcard-static__image">
            @if (image(); as imageUrl) {
              <app-image-magnifier [image]="imageUrl" [alt]="name()"
                (loaded)="onImageLoad($event)" />
            } @else {
              <span>目前沒有可用圖像</span>
            }
          </div>
          <div class="postcard-static__caption">
            <strong>{{ name() }}</strong>
            <span>{{ type() }}</span>
          </div>
        </article>
      </div>
    } @else {
      <figure class="original-static">
        @if (image(); as imageUrl) {
          <app-image-magnifier [image]="imageUrl" [alt]="name() + '原文物影像'" />
        } @else {
          <span>目前沒有可用圖像</span>
        }
        <figcaption>
          <strong>原文物尺寸</strong>
          <span>{{ dimensions() }}</span>
          @if (description()) {
            <small>{{ description() }}</small>
          }
        </figcaption>
      </figure>
    }
  </div>

  <!-- 圖片下方只保留幾個圖示化功能，圖片先看、操作後置，符合一般商品圖庫習慣。 -->
  <div class="gallery-function-bar" aria-label="圖片功能">
    <button type="button" class="gallery-icon-button" [class.is-active]="selectedMode() === 'static'"
      [attr.aria-pressed]="selectedMode() === 'static'" (click)="selectedMode.set('static')" title="靜態圖片">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><rect x="4" y="4" width="16" height="16" rx="1.5" /></svg>
      <small>靜態</small>
    </button>
    <button type="button" class="gallery-icon-button" [class.is-active]="selectedMode() === 'dynamic'"
      [attr.aria-pressed]="selectedMode() === 'dynamic'" [disabled]="!image()"
      (click)="selectedMode.set('dynamic')" title="翻面查看明信片">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M7 7h8.5a3.5 3.5 0 0 1 0 7H13" /><path d="m16 4 3 3-3 3" /><path d="M17 17H8.5a3.5 3.5 0 0 1 0-7H11" /><path d="m8 20-3-3 3-3" /></svg>
      <small>翻面</small>
    </button>
    <span class="gallery-function-divider" aria-hidden="true"></span>
    <button type="button" class="gallery-icon-button" [class.is-active]="selectedMode() === 'static' && selectedView() === 'postcard'"
      [attr.aria-pressed]="selectedMode() === 'static' && selectedView() === 'postcard'"
      (click)="selectedMode.set('static'); selectedView.set('postcard')" title="查看明信片正面">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><rect x="3.5" y="5" width="17" height="14" rx="1.5" /><path d="m6.5 16 3.5-3.5 2.5 2.5 2-2 3 3" /></svg>
      <small>正面</small>
    </button>
    <button type="button" class="gallery-icon-button" [class.is-active]="selectedMode() === 'static' && selectedView() === 'original'"
      [attr.aria-pressed]="selectedMode() === 'static' && selectedView() === 'original'" [disabled]="!image()"
      (click)="selectedMode.set('static'); selectedView.set('original')" title="查看縮小複製品原圖">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><circle cx="10.5" cy="10.5" r="5.5" /><path d="m15 15 5 5" /><path d="m8 11 2-2 2 2 1.5-1.5 2 2" /></svg>
      <small>原圖</small>
    </button>
    <span class="gallery-function-divider" aria-hidden="true"></span>
    <!-- 每件商品只保留一種自動判定版型；旋轉只改變觀看方向，不重排明信片內容。 -->
    <button type="button" class="gallery-icon-button" [class.is-active]="rotated()"
      [attr.aria-pressed]="rotated()" [disabled]="!image() || (selectedMode() === 'static' && selectedView() === 'original')"
      (click)="rotated.update(value => !value)" [title]="rotated() ? '復原觀看方向' : '旋轉觀看方向'">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M19 8a7 7 0 0 0-12.5-2L5 8" /><path d="M5 4v4h4" /><path d="M5 16a7 7 0 0 0 12.5 2L19 16" /><path d="M19 20v-4h-4" /></svg>
      <small>{{ rotated() ? '復原' : '旋轉' }}</small>
    </button>
    <span class="gallery-icon-note" title="將游標移入圖片即可局部放大">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><circle cx="10.5" cy="10.5" r="5.5" /><path d="m15 15 5 5" /></svg>
      <small>放大</small>
    </span>
  </div>
</div>
