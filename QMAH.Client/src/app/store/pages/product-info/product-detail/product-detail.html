<!-- 商品說明區塊 -->
<section class="section-block">
  <app-section-head headingLevel="h2" [title]="title" [tag]="tag" />

  <!-- 依資料中的空行分段；標題單行加粗，避免整段擠成一大坨文字。 -->
  <div class="detail-text">
    @for (block of descriptionBlocks(); track $index) {
      <div class="detail-paragraph">
        @if (block.heading) { <strong>{{ block.heading }}</strong> }
        @for (line of block.lines; track $index) { <span>{{ line }}</span> }
      </div>
    }
  </div>

  <!-- 補充條列：保養、退換、鑑定；這些是商品政策，不混入文物說明本文。 -->
  <div class="detail-list">
    @for (row of rows(); track row.label) {
      <div class="detail-row">
        <span class="spec-label spec-label--wide">{{ row.label }}</span>
        <span class="spec-value">{{ row.text }}</span>
      </div>
    }
  </div>
</section>
