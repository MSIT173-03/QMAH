<!-- 頂部公告列與登入提示 -->
<app-session-bar [cart]="cart" />

<app-site-header>
  <!-- 站內搜尋框 -->
  <app-search-bar (search)="onSearch($event)" />
</app-site-header>

<div class="container home-main">

  <!-- 主視覺輪播 -->
  <app-hero-carousel />

  <!-- 分類入口／年代選藏：上下分欄 -->
  <section class="entry-section">
    <app-category-grid />
    <app-era-grid />
  </section>

  <!-- 熱銷排行 -->
  <app-ranking-section (addToCart)="onAddToCart($event)" />

  <!-- 新品上架 -->
  <app-new-arrivals (addToCart)="onAddToCart($event)" />

  <!-- 為你推薦 -->
  <app-recommendations [items]="recommendedItems()" (addToCart)="onAddToCart($event)" />
</div>
