@if (rankingItems().length > 0) {
  <!-- 沒有排行資料時不顯示整個區塊 -->
  <section class="section-block">
    <app-section-head title="熱銷排行" tag="RANKING · 24H" [wrap]="true">
      <div class="section-meta">
        <app-pill-group [options]="tabOptions()" (select)="pickTab($event)" />
      </div>
    </app-section-head>
    <div #grid class="card-grid">
      @for (item of visibleItems(); track item.id) {
        <app-product-card [id]="item.id" [coverImage]="item.coverImage" [badge]="item.badge" [badgeVariant]="item.badgeVariant" [brand]="item.brand"
          [name]="item.name" [price]="item.price" [was]="item.was" [rating]="item.rating" [reviews]="item.reviews"
          [sold]="item.sold" (addToCart)="addToCart.emit(item.id)" />
      }
    </div>
  </section>
}
