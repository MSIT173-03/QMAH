@if (items().length > 0) {
  <!-- 還沒有推薦商品時不顯示整個區塊，不留下空標題 -->
  <section class="section-block">
    <app-section-head title="為你推薦" tag="依圖鑑解鎖與購買紀錄智慧推薦" [wrap]="true">
      <button type="button" class="section-more refresh-btn" (click)="refresh.emit()">換一批 ↻</button>
    </app-section-head>
    <div #grid class="card-grid">
      @for (item of visibleItems(); track item.id) {
        <app-product-card [id]="item.id" [coverImage]="item.coverImage" [badge]="item.badge" [badgeVariant]="item.badgeVariant" [badgeTone]="item.badgeTone ?? null" [brand]="item.brand"
          [name]="item.name" [price]="item.price" [was]="item.was" [rating]="item.rating" [reviews]="item.reviews"
          [sold]="item.sold" (addToCart)="addToCart.emit(item.id)" />
      }
    </div>
  </section>
}
