<!-- 分類入口：各分類的圖示卡片與商品件數 -->
<section class="section-block">
  <app-section-head title="分類入口" [tag]="tagText()" />
  <div class="cat-grid">
    @for (cat of categories(); track cat.name) {
      <a [storeLink]="cat.link" class="cat-card">
        <div class="cat-icon">
          @if (cat.image) {
            <img class="cat-icon-image" [src]="cat.image" [alt]="cat.name" />
          } @else {
            ICON
          }
        </div>
        <span class="text-sm">{{ cat.name }}</span>
        <span class="cat-count">{{ cat.count }} 件</span>
      </a>
    }
  </div>
</section>
