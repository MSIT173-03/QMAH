<!-- 為你推薦：隨機挑選的商品清單 -->
<section class="section-block">
  <app-section-head title="為你推薦" tag="FOR YOU" />
  <div class="card-grid">
    @for (item of items(); track item.id) {
    <app-product-card [id]="item.id" [coverImage]="item.coverImage" [badge]="item.badge" [badgeVariant]="item.badgeVariant" [brand]="item.brand"
      [name]="item.name" [price]="item.price" [was]="item.was" [rating]="item.rating" [reviews]="item.reviews"
      [sold]="item.sold" (addToCart)="addToCart.emit(item.id)" />
    }
  </div>
</section>
