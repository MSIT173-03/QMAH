@if (items().length > 0) {
  <!-- ui-integration: 空 API 結果不渲染只有標題的商品區，讓首頁版面依真實內容收縮。 -->
  <app-panel>
    <app-section-head variant="panel" title="新品上架" [tag]="tagText()">
      <a class="section-more" [storeLink]="moreHref">更多 →</a>
    </app-section-head>
    <div class="news-list">
      @for (item of items(); track item.id) {
        <div class="news-item">
          <a [storeLink]="productPath(item.id)" class="news-link">
            <div class="news-thumb">
              <svg lucidePackageSearch aria-hidden="true" focusable="false"></svg>
            </div>
            <div class="news-info">
              <span class="product-card-brand">{{ item.brand }}</span>
              <span class="news-name">{{ item.name }}</span>
              <div class="news-price-row">
                <span class="news-price" [class.text-accent]="item.hasDeal">{{ item.priceText }}</span>
                <span class="news-tag" [class.news-tag--deal]="item.hasDeal">{{ item.tagText }}</span>
                <span class="news-rating"><span class="product-card-star">★</span> {{ item.ratingText }} · {{ item.reviewsText }}</span>
              </div>
            </div>
          </a>
          <button type="button" class="news-add" (click)="addToCart.emit(item.id)">加入</button>
        </div>
      }
    </div>
  </app-panel>
}
