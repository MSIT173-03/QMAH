<section class="hero" aria-label="商城主視覺輪播" aria-roledescription="carousel">
  <div class="hero-track" [style.transform]="trackShift()">
    @for (slide of slides; track $index) {
      <div class="hero-slide" [class]="'hero-slide hero-slide--' + ($index % 3)" role="group"
        [attr.aria-label]="($index + 1) + ' / ' + slides.length">
        <img class="hero-slide-image" src="{{ slideImage($index) }}" alt="" aria-hidden="true"
          [attr.loading]="$index === 0 ? 'eager' : 'lazy'" [attr.fetchpriority]="$index === 0 ? 'high' : 'low'" />
        <div class="hero-slide-body">
          <span class="hero-kicker">{{ slide.kicker }}</span>
          <h2 class="hero-title">{{ slide.title }}</h2>
          <p class="hero-desc">{{ slide.desc }}</p>
          <a [storeLink]="productsPath" class="btn-solid hero-cta">立即選購</a>
        </div>
      </div>
    }
  </div>

  <div class="hero-controls" aria-label="輪播控制">
    <div class="hero-dots">
      @for (slide of slides; track $index; let i = $index) {
        <button
          type="button"
          class="hero-dot"
          [class.hero-dot--active]="i === activeSlide()"
          [attr.aria-label]="'查看第 ' + (i + 1) + ' 張主視覺'"
          [attr.aria-current]="i === activeSlide() ? 'true' : null"
          (click)="goToSlide(i)"
        ></button>
      }
    </div>
    <button
      type="button"
      class="hero-play-toggle"
      [class.hero-play-toggle--paused]="!autoplayEnabled()"
      [attr.aria-pressed]="!autoplayEnabled()"
      (click)="toggleAutoplay()"
    >
      <app-qmah-icon [name]="autoplayEnabled() ? 'pause' : 'play'" [size]="12" aria-hidden="true" />
      {{ autoplayEnabled() ? '暫停輪播' : '播放輪播' }}
    </button>
  </div>
</section>
