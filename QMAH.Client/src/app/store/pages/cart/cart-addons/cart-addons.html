<!-- 再加購：精簡版商品卡片（僅品牌／名稱／價格），供快速加入購物車 -->
<section class="section-block">
  <app-section-head title="再加購" tag="ADD ON" />
  <div class="card-grid">
    @for (item of items(); track item.id) {
    <app-product-card variant="compact" [id]="item.id" [brand]="item.brand" [name]="item.name" [price]="item.price"
      [was]="item.was" (onAddToCart)="addToCart.emit(item.id)" />
    }
  </div>
</section>
