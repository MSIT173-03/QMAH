<!-- 購物車單一行項目：縮圖、商品資訊、數量／小計／移除 -->
<div class="cart-line" [class.cart-line--leaving]="leaving()">
  <!-- 商品縮圖，連結至商品頁 -->
  <a [href]="href()" class="cart-line-thumb">{{ thumbSlot }}</a>

  <div class="cart-line-info">
    <!-- 品牌與器類 -->
    @let b = brand();
    @let c = cat();
    @if(b && c){
    <span class="cart-line-meta">{{ b }} · {{ c }}</span>
    }
    @else if (b) {
    <span class="cart-line-meta">{{ b }}</span>
    }
    @else if (c) {
    <span class="cart-line-meta">{{ c }}</span>
    }

    <!-- 商品名稱，連結至商品頁 -->
    <a [href]="href()" class="cart-line-name">{{ name() }}</a>

    <!-- 價格列：單價、原價劃線價與折扣標籤（顯示字串沿用 app-product-card 的推導） -->
    <div class="cart-line-price-row">
      <span class="product-card-price" [class.text-accent]="hasDeal()">${{ getPrice() }}</span>
      @if (getWas(); as was) {
      <span class="product-card-was">${{ was }}</span>
      }
      <span class="product-card-tag" [class.product-card-tag--deal]="hasDeal()">{{ getTag() }}</span>
    </div>
  </div>

  <div class="cart-line-aside">
    <!-- 數量增減器：可減至 0，觸發移除 -->
    <app-qty-stepper [value]="qty()" [min]="0" size="sm" (valueChange)="qtyChange.emit($event)" />
    <!-- 此行小計 -->
    <span class="cart-line-total">共 ${{ getLineTotal() }}</span>
    <!-- 移除按鈕 -->
    <button type="button" class="cart-line-remove" (click)="remove.emit()">{{ removeLabel }}</button>
  </div>
</div>
