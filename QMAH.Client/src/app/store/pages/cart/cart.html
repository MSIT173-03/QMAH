<!-- 頁首：品牌 Logo、分類捷徑，以及購物車件數 -->
<app-site-header>
  <app-header-actions [links]="navLinks">
    <span class="cart-count">{{ count() }} 件商品</span>
  </app-header-actions>
</app-site-header>

<div class="container cart-main">

  <!-- 麵包屑導覽 -->
  <app-breadcrumb [items]="breadcrumbItems" />

  <!-- 頁面標題列 -->
  <app-page-title-row title="購物車" tag="CART" [link]="continueShoppingLink" />

  @if (error(); as message) { <p class="cart-feedback" role="alert">{{ message }}</p> }

  @if (hasItems()) {
  <!-- 購物車有商品：左側逐行清單，右側訂單摘要 -->
  <div class="cart-body">
    <div class="cart-lines">
      @for (line of lines(); track line.id) {
      <app-cart-line [id]="line.id" [coverImage]="line.coverImage" [brand]="line.brand" [cat]="line.cat" [name]="line.name" [price]="line.price"
        [was]="line.was" [qty]="line.qty" [lineTotal]="line.lineTotal" [leaving]="line.leaving"
        (qtyChange)="onQtyChange(line.id, $event)" (remove)="onRemove(line.id)" />
      }
    </div>

    <app-cart-summary [amounts]="amounts()" />
  </div>
  } @else if (loaded()) {
  <!-- 購物車是空的 -->
  <app-empty-state title="購物車目前是空的" desc="從器類逛起，或看看本期特展聯名的文物明信片。" ctaLabel="開始選購" [ctaHref]="continueShoppingLink.href" size="lg" />
  }

  <!-- 再加購 -->
  <app-cart-addons [items]="addons()" (addToCart)="onAddAddon($event)" />
</div>

<!-- 頁尾：簡版，僅顯示版權列 -->
