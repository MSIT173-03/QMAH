<!-- 網站頁尾：simple 版僅顯示版權列，full 版另含品牌與連結欄位 -->
<footer class="site-footer">
  @if (variant() === 'full') {
    <!-- 品牌介紹與連結欄位，僅 full 版顯示 -->
    <div class="footer-cols">
      <div class="footer-brand">
        <img src="{{ logoSrc }}" [alt]="logoAlt" class="brand-logo-img brand-logo-img--lg self-start" />
        <p class="footer-brand-note">{{ brandNote }}</p>
        <a class="footer-col-link" [href]="githubUrl" target="_blank" rel="noopener noreferrer">GitHub 專案</a>
      </div>
      @for (col of columns(); track col.title) {
        <div class="footer-col">
          <span class="label-tag">{{ col.title }}</span>
          @for (link of col.links; track link.label) {
            @if (link.href !== '#') {
              <a [storeLink]="link.href" class="footer-col-link">{{ link.label }}</a>
            } @else {
              <!-- ui-integration: mock 設定中的未實作頁面保留資訊文字，不渲染成會回到頂端的假連結。 -->
              <span class="footer-col-link footer-col-link--disabled" aria-disabled="true">{{ link.label }}</span>
            }
          }
        </div>
      }
    </div>

    <div class="footer-bottom">
      <ng-container [ngTemplateOutlet]="bottomRow" [ngTemplateOutletContext]="{ simple: false }" />
    </div>
  } @else {
    <ng-container [ngTemplateOutlet]="bottomRow" [ngTemplateOutletContext]="{ simple: true }" />
  }
</footer>

<!-- 版權列：full 版與 simple 版共用內容，僅外層樣式不同 -->
<ng-template #bottomRow let-simple="simple">
  <div class="footer-bottom-row" [class.footer-bottom-row--simple]="simple">
    <span>{{ copyright }}</span>
    <a [storeLink]="privacyHref" class="footer-link">隱私權政策</a>
    <a [storeLink]="termsHref" class="footer-link">服務條款</a>
    <!-- ui-integration: 聯絡入口只指向實際 GitHub 組織頁，不捏造客服電話或信箱。 -->
    <a class="footer-link" [href]="githubUrl" target="_blank" rel="noopener noreferrer">聯絡我們</a>
  </div>
</ng-template>
