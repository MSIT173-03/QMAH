<!-- 頁面標題列：標題、標籤、數量、額外投影內容與右側連結 -->
<div class="page-title-row">
  <h1 class="page-title">{{ title() }}</h1>
  <!-- 標題旁標籤（例如「CART」），無值時不顯示 -->
  @if (tag()) {
    <span class="label-tag">{{ tag() }}</span>
  }
  <!-- 數量說明文字（例如「128 件商品」），無值時不顯示 -->
  @if (count()) {
    <span class="page-title-count">{{ count() }}</span>
  }
  <!-- 供外部投影額外內容 -->
  <ng-content></ng-content>
  <!-- 右側連結（例如「繼續選購 →」），無值時不顯示 -->
  @if (link(); as l) {
    <a [href]="l.href" class="page-title-link">{{ l.label }}</a>
  }
</div>
