<!-- 頁首右側操作區：導覽連結 + 投影內容（購物車入口等） -->
<div class="hdr-actions">
  <!-- 分類／主題導覽連結，無資料時整組不顯示 -->
  @if (links().length > 0) {
    <div class="nav-links">
      @for (link of links(); track link.label) {
        <a [storeLink]="link.href">{{ link.label }}</a>
      }
    </div>
  }

  <!-- 供外部投影購物車入口、購物車件數說明等 -->
  <ng-content></ng-content>
</div>
