<!--
  面板本身仍是觸發容器的子節點（即使收合時視覺上不可見），滑鼠從連結移到面板途中
  才不會因為離開了 DOM 而先被判定成 mouseleave、面板提早關閉；
  開關改用 class 淡入淡出，而不是 @if 整個掛載／卸載。
-->
<div class="promobar-panel-trigger" (mouseenter)="open.set(true)" (mouseleave)="open.set(false)">
  <ng-content select="[panelTrigger]" />
  <div class="promobar-panel" [class.promobar-panel--open]="open()" [attr.aria-hidden]="!open()" [inert]="!open()">
    <ng-content />
  </div>
</div>
