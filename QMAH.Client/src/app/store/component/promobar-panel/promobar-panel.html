<!--
  面板本身是觸發容器的子節點（收合時視覺上不可見），開關改用 class 淡入淡出，而不是 @if 掛載／卸載。
  收合條件由元件處理：點外面、Esc、滑鼠離開超過一段距離；滑到另一個連結會直接換成那個面板。
-->
<div #trigger class="promobar-panel-trigger" (mouseenter)="show()" (focusin)="show()">
  <ng-content select="[panelTrigger]" />
  <div #panel class="promobar-panel" [class.promobar-panel--open]="open()" [attr.aria-hidden]="!open()" [inert]="!open()">
    <ng-content />
  </div>
</div>
