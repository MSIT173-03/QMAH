<section class="section-block">
  <app-section-head [title]="title()" [tag]="tag()" />
  <div class="cat-grid" [style.--cols]="columns()">
    @for (item of items(); track item.link) {
      <a [storeLink]="item.link" [class]="'cat-card cat-card--' + item.tone">
        <div class="cat-icon">
          <span class="cat-name">{{ item.name }}</span>
          <span class="cat-count">{{ item.count }} 件</span>
          <span class="cat-glyph" [attr.data-glyph]="item.glyph" aria-hidden="true"></span>
        </div>
      </a>
    }
  </div>
</section>
