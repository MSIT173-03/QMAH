<!-- 商品列表頁篩選側欄：捲動時固定於視窗上方 -->
<aside class="filter-sidebar">

  <!-- 清除所有篩選：放在側欄最上方，不受任一面板收合狀態影響 -->
  <button type="button" class="filter-reset filter-reset--top" (click)="reset.emit()">{{ resetLabel }}</button>

  <!-- 可收合面板：標題列與收合外框共用，內容依面板種類切換；沒有年代資料時不顯示年代面板 -->
  @for (panel of panels(); track panel.section) {
    <app-panel variant="filter">
      <button type="button" class="filter-panel-head" [attr.aria-expanded]="isOpen(panel.section)" (click)="toggleSection(panel.section)">
        <span class="label-tag label-tag--loose">{{ panel.label }}</span>
        <app-qmah-icon name="chevron-right" [size]="14" class="filter-panel-chevron" [class.filter-panel-chevron--open]="isOpen(panel.section)" aria-hidden="true" />
      </button>
      <div class="filter-panel-collapse" [class.filter-panel-collapse--open]="isOpen(panel.section)">
        <div class="filter-panel-collapse-inner">
          @switch (panel.section) {
            @case ('category') {
              <app-category-list [items]="categories()" (pick)="categoryPick.emit($event)" />
            }
            @case ('era') {
              <app-category-list [items]="eras()" (pick)="eraPick.emit($event)" />
            }
            @case ('price') {
              <app-pill-group variant="band" layout="column" [options]="bandOptions()" (select)="bandPick.emit($event)" />
            }
            @case ('filter') {
              <!-- 其他篩選：目前只有折扣開關 -->
              <app-pill-group variant="filter" layout="column" [options]="dealOptions()" (select)="dealToggle.emit()" />
            }
          }
        </div>
      </div>
    </app-panel>
  }
</aside>
