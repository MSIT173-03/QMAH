<!-- 網站頁首：內容（搜尋框、導覽連結、步驟指示器等）全由外部投影；品牌 Logo 由外層 App Shell 提供 -->
<header class="site-header">
  <div class="site-header-row" [class]="variant() === 'default' ? '' : 'site-header-row--' + variant()">
    <ng-content></ng-content>
  </div>

  <!-- ui-integration: Store 保留自己的搜尋與導覽；跨 Area 入口由外層 App Shell 統一提供，避免主導航競爭。 -->
</header>
