<!-- 搜尋列外層容器 -->
<div class="search-wrap" [class.search-wrap--list]="compact()">
  <!-- 輸入框與搜尋按鈕：不論 compact 與否，尺寸固定一致 -->
  <div class="search-box">
    <input class="search-input" name="store-search" autocomplete="off" aria-label="搜尋商城商品" type="search" [placeholder]="placeholder()" [value]="value()" (input)="onInput($event)"
      (keydown.enter)="submit()" />
    <button type="button" class="search-submit" (click)="submit()">搜尋</button>
  </div>
</div>
