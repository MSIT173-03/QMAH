<!-- 藥丸狀選項按鈕群組 -->
<div class="pill-row" [class]="layout() === 'row' ? '' : 'pill-row--' + layout()">
  @for (option of options(); track option.label; let i = $index) {
    <!-- 單一選項按鈕，樣式依 variant 與 active 狀態變化 -->
    <button
      type="button"
      class="pill"
      [class]="variant() === 'default' ? '' : 'pill--' + variant()"
      [class.pill--active]="option.active"
      [attr.title]="option.title ?? null"
      (click)="select.emit(i)"
    >{{ option.label }}</button>
  }
</div>
