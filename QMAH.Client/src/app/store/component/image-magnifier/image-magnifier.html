<div class="magnifier-host"
  [class.magnifier-host--contain]="fit() === 'contain'"
  [class.magnifier-host--pan-forward]="pan() === 'forward'"
  [class.magnifier-host--pan-backward]="pan() === 'backward'"
  [class.magnifier-host--pan-even]="panKey() % 2 === 0"
  [class.magnifier-host--pan-odd]="panKey() % 2 !== 0"
  [class.magnifier-host--pan-paused]="panPaused()"
  [class.magnifier-host--persistent]="persistentLens()"
  [class.is-dragging]="dragging()"
  (pointermove)="move($event)"
  (pointerdown)="startDrag($event)"
  (pointerup)="stopDrag($event)"
  (pointercancel)="stopDrag($event)"
  (lostpointercapture)="stopDrag()"
  (pointerenter)="active.set(true)"
  (pointerleave)="leave()">
  @if (image(); as imageUrl) {
    <img src="{{ imageUrl }}" [alt]="alt()" decoding="async" draggable="false" (load)="onLoad($event)" />
    <!-- 局部鏡頭跟著游標或指標拖曳，僅放大目前位置，不改變原本商品版面流。 -->
    <span
      class="magnifier-lens"
      [class.is-active]="active()"
      [attr.role]="persistentLens() ? 'button' : null"
      [attr.tabindex]="persistentLens() ? 0 : null"
      [attr.aria-label]="persistentLens() ? '放大鏡，可拖曳或用方向鍵查看畫卷細節' : null"
      (keydown)="moveWithKeyboard($event)"
      [style.left.%]="position().x" [style.top.%]="position().y"
      [style.background-image]="'url(' + imageUrl + ')'"
      [style.background-size]="backgroundSize()"
      [style.background-position]="backgroundPosition()"></span>
  } @else {
    <span class="magnifier-placeholder">
      <svg lucideImage aria-hidden="true" focusable="false"></svg>
      <span>目前沒有可用圖像</span>
    </span>
  }
</div>
