<!-- key-list.html -->
<div class="key-page" [class.key-page--embedded]="embedded">

  <div class="page-header">
    <div class="page-header__bar">
      <div class="page-header__title-group">
        <svg lucideLibrary class="page-header__icon" aria-hidden="true" focusable="false"></svg>
        <h1 class="page-header__title">鑰匙背包</h1>
      </div>
    </div>
    <p class="page-header__sub">查看你目前持有的各類文物鑰匙</p>
  </div>

  <div *ngIf="loading()" class="state state--loading">
    <span class="spinner"></span>載入中...
  </div>

  <div *ngIf="errorMsg()" class="state state--error">{{ errorMsg() }}</div>

  <ng-container *ngIf="!loading() && !errorMsg()">

    <div class="section-title">
      <h2>我的鑰匙</h2>
      <span class="key-count">{{ totalKeyCount() }} 把</span>
    </div>

    <div class="filter-bar" role="group" aria-label="鑰匙類型篩選">
      <button
        type="button"
        class="filter-button"
        [class.active]="selectedFilter() === 'ALL'"
        [attr.aria-pressed]="selectedFilter() === 'ALL'"
        (click)="setFilter('ALL')"
      >
        全部
        <span>{{ getFilterCount('ALL') }}</span>
      </button>

      <button
        type="button"
        class="filter-button"
        [class.active]="selectedFilter() === 'NORMAL'"
        [attr.aria-pressed]="selectedFilter() === 'NORMAL'"
        (click)="setFilter('NORMAL')"
      >
        一般
        <span>{{ getFilterCount('NORMAL') }}</span>
      </button>

      <button
        type="button"
        class="filter-button"
        [class.active]="selectedFilter() === 'CATEGORY'"
        [attr.aria-pressed]="selectedFilter() === 'CATEGORY'"
        (click)="setFilter('CATEGORY')"
      >
        分類
        <span>{{ getFilterCount('CATEGORY') }}</span>
      </button>

      <button
        type="button"
        class="filter-button"
        [class.active]="selectedFilter() === 'ERA'"
        [attr.aria-pressed]="selectedFilter() === 'ERA'"
        (click)="setFilter('ERA')"
      >
        年代
        <span>{{ getFilterCount('ERA') }}</span>
      </button>

      <button
        type="button"
        class="filter-button"
        [class.active]="selectedFilter() === 'UNIVERSAL'"
        [attr.aria-pressed]="selectedFilter() === 'UNIVERSAL'"
        (click)="setFilter('UNIVERSAL')"
      >
        萬能
        <span>{{ getFilterCount('UNIVERSAL') }}</span>
      </button>
    </div>

    <div class="key-slot-grid" #slotGrid>
      <button
        type="button"
        class="key-slot"
        *ngFor="let key of displaySlots(); trackBy: trackByDisplaySlot"
        [class.key-slot--empty]="!key"
        [class.normal-key]="key?.scopeType === 'NORMAL'"
        [class.category-key]="key?.scopeType === 'CATEGORY'"
        [class.era-key]="key?.scopeType === 'ERA'"
        [class.universal-key]="key?.scopeType === 'UNIVERSAL'"
        [disabled]="!key"
        [attr.aria-label]="key ? keyScopeLabel(key.scopeType) + '，' + keyScopeDescription(key.scopeType) + '，持有 ' + key.balance + ' 把' : '空的鑰匙格'"
        (click)="key && onKeySlotClick(key)"
      >
        <ng-container *ngIf="key as k">
          <div class="key-slot__icon">
            <img [src]="keySlotIcon(k)" [alt]="k.name + '圖示'" loading="lazy" />
          </div>
          <span class="key-slot__count">{{ k.balance }}</span>

          <div class="key-slot__tooltip">
            <p class="key-slot__tooltip-name">{{ keyScopeLabel(k.scopeType) }}</p>

            <p class="key-slot__tooltip-detail">{{ k.name }}</p>

            <p class="key-slot__tooltip-description">{{ keyScopeDescription(k.scopeType) }}</p>

            <p class="key-slot__tooltip-row">
              <span>開鎖類別</span>
              <strong [ngSwitch]="k.scopeType">
                <ng-container *ngSwitchCase="'NORMAL'">探索鑰匙</ng-container>
                <ng-container *ngSwitchCase="'UNIVERSAL'">萬能鑰匙</ng-container>
                <ng-container *ngSwitchCase="'CATEGORY'">分類鑰匙（{{ getCategoryName(k.categoryId) }}）</ng-container>
                <ng-container *ngSwitchCase="'ERA'">年代鑰匙（{{ getEraName(k.eraBucketId) }}）</ng-container>
              </strong>
            </p>

            <p class="key-slot__tooltip-row">
              <span>回收點數</span>
              <strong>{{ k.recyclePointValue }}</strong>
            </p>

            <p class="key-slot__tooltip-hint" *ngIf="k.scopeType === 'UNIVERSAL'; else useHint">
              請至圖鑑頁的文物卡片上使用
            </p>
            <ng-template #useHint>
              <p class="key-slot__tooltip-hint">點擊使用</p>
            </ng-template>
          </div>
        </ng-container>
      </button>
    </div>

  </ng-container>

  <!-- 使用鑰匙確認視窗 -->
  <div
    class="confirm-overlay"
    [class.open]="confirmTarget() !== null"
    (click)="onConfirmOverlayClick($event)"
  >
    <div
      class="confirm-dialog"
      *ngIf="confirmTarget() as key"
      role="dialog"
      aria-modal="true"
      aria-labelledby="key-use-dialog-title"
    >
      <img class="key-icon" [src]="keySlotIcon(key)" [alt]="key.name + '圖示'" />
      <h3 id="key-use-dialog-title">使用鑰匙</h3>
      <p>確定要使用「{{ key.name }}」嗎？</p>
      <p class="have">
        使用後將消耗 <strong>{{ confirmCost() }}</strong> 把，剩餘 <strong>{{ key.balance - confirmCost() }}</strong> 把
        <span class="warn" *ngIf="confirmInsufficient()">（數量不足）</span>
      </p>
      <p class="have warn" *ngIf="unlockError()">{{ unlockError() }}</p>
      <div class="confirm-actions">
        <button type="button" class="action-btn cancel-btn" [disabled]="unlocking()" (click)="cancelUseKey()">取消</button>
        <button type="button" class="action-btn unlock-btn" [disabled]="unlocking() || confirmInsufficient()" (click)="confirmUseKey()">
          {{ unlocking() ? '解鎖中...' : '確定使用' }}
        </button>
      </div>
    </div>
  </div>

  <!-- 解鎖成功結果視窗 -->
  <div
    class="confirm-overlay"
    [class.open]="unlockResult() !== null"
    (click)="onResultOverlayClick($event)"
  >
    <div
      class="confirm-dialog"
      *ngIf="unlockResult() as result"
      role="dialog"
      aria-modal="true"
      aria-labelledby="key-result-dialog-title"
    >
      <svg lucideCircleCheckBig class="key-icon" aria-hidden="true" focusable="false"></svg>
      <h3 id="key-result-dialog-title">解鎖成功</h3>
      <p>你解鎖了「{{ result.artifactName }}」</p>
      <p class="have">要現在前往圖鑑查看這件文物嗎？</p>
      <div class="confirm-actions">
        <button type="button" class="action-btn cancel-btn" (click)="closeUnlockResult()">稍後查看</button>
        <button type="button" class="action-btn unlock-btn" (click)="goToArtifact()">前往查看</button>
      </div>
    </div>
  </div>

</div>
